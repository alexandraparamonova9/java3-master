<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вход</title>

    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="css/style.css">

    <script src="js/api.js" defer></script>
    <script src="js/login.js" defer></script>
</head>

<body>

<header class="header">
    <div class="container">
        <h1>Система студентов</h1>
    </div>
</header>

<main class="main">
    <div class="container">

        <section class="student-form-section">

            <h2 id="authTitle">Вход</h2>

            <p id="authMessage" class="message" hidden></p>

            <form id="loginForm" class="student-form" novalidate>

                <div class="form-group">
                    <label for="loginUsername">Имя пользователя</label>
                    <input type="text" id="loginUsername" autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="loginPassword">Пароль</label>
                    <input type="password" id="loginPassword" autocomplete="current-password">
                </div>

                <div class="form-actions">
                    <button type="submit" class="button button-save">Войти</button>
                    <button type="button" id="showRegister" class="button button-secondary">Регистрация</button>
                </div>

            </form>

            <form id="registerForm" class="student-form" novalidate>

                <div class="form-group">
                    <label for="regUsername">Имя пользователя</label>
                    <input type="text" id="regUsername" autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="regEmail">Электронная почта</label>
                    <input type="email" id="regEmail" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="regPassword">Пароль</label>
                    <input type="password" id="regPassword" autocomplete="new-password">
                </div>

                <div class="form-actions">
                    <button type="submit" class="button button-save">Зарегистрироваться</button>
                    <button type="button" id="showLogin" class="button button-secondary">Назад ко входу</button>
                </div>

            </form>

        </section>

    </div>
</main>

<footer class="footer">
    <div class="container">
        <p>Система управления студентами</p>
    </div>
</footer>

</body>

</html>
